spring:
  application:
    name: styletrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/styletrack}
    username: ${DB_USERNAME:styletrack}
    password: ${DB_PASSWORD:styletrack}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Manila}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: ${APP_TIMEZONE:Asia/Manila}
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

styletrack:
  jwt:
    # Must be at least 32 characters. Override with JWT_SECRET in every real deployment.
    secret: ${JWT_SECRET:dev-only-secret-please-change-dev-only-secret-please-change}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  loyalty:
    pesos-per-point: ${LOYALTY_PESOS_PER_POINT:100}
    silver-visits: ${LOYALTY_SILVER_VISITS:5}
    gold-visits: ${LOYALTY_GOLD_VISITS:10}
  payment:
    qr-ph-image-url: ${QRPH_IMAGE_URL:}
    qr-ph-account-name: ${QRPH_ACCOUNT_NAME:Jonathan Hair Studio}
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  paymongo:
    secret-key: ${PAYMONGO_SECRET_KEY:}
    webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:}
    api-base: ${PAYMONGO_API_BASE:https://api.paymongo.com/v1}
    qr-expiry-seconds: ${PAYMONGO_QR_EXPIRY_SECONDS:1800}
  booking:
    home-service-fee: ${HOME_SERVICE_FEE:0}
    travel-buffer-minutes: ${TRAVEL_BUFFER_MINUTES:30}
    slot-minutes: ${SLOT_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
  seed:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
    demo: ${SEED_DEMO:false}
